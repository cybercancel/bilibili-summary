# B站视频总结系统 v2.0 配置文件模板
# 复制此文件为 config.yaml 并填写你的配置

# 下载设置
download:
  output_dir: "videos"
  format: "bestaudio[ext=mp4]/bestaudio"  # 优先mp4音频
  cookies_browser: null  # "chrome" / "edge" / null
  cookies_file: null     # cookies.txt 路径
  max_filesize: null     # 最大文件大小限制 (如 500M)
  # B站反爬必备
  impersonate: "chrome"  # 必须设置，绕过B站412反爬

# 字幕设置
subtitle:
  output_dir: "subtitles"
  languages: ["ai-zh", "zh-Hans"]  # 优先AI字幕
  auto_fallback: true  # 字幕提取失败时降级到Whisper
  # B站API备选方案
  bilibili_api:
    enabled: true
    timeout: 30

# 转录设置
transcribe:
  output_dir: "transcripts"
  model: "base"         # tiny/base/small/medium/large
  device: "auto"        # auto/cuda/cpu
  language: "zh"
  compute_type: "float16"  # float16/int8_float16/int8

# 文本处理
merge:
  output_dir: "merged"
  min_segment_length: 10   # 最小分段长度（字符）
  dedup_threshold: 0.8     # 去重阈值

# LLM总结
llm:
  model_name: "deepseek-chat"
  api_key: ${DEEPSEEK_API_KEY}  # 从环境变量 DEEPSEEK_API_KEY 读取，或在此处填写
  base_url: "https://api.deepseek.com"
  max_tokens: 4096
  temperature: 0.3
  request_timeout: 120
  max_retries: 3
  # 长文本分块
  chunk:
    max_chars: 6000
    overlap: 500

# 输出设置
output:
  summary_dir: "summaries"
  log_dir: "logs"
  format: "markdown"

# 通知设置
notify:
  enabled: false
  webhook_url: null
  webhook_method: "POST"
  email:
    smtp_host: null
    smtp_port: 587
    sender: null
    password: null
    recipients: []

# 断点续传
resume:
  enabled: true
  status_dir: "summaries"  # 状态文件与总结同目录
